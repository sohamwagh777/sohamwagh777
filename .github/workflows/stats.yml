name: Stats

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: sohamwagh777
          template: classic
          config_display: columns
          config_animations: no
          base: header,activity
          repositories: 10
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_ignored: HTML,CSS
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          filename: .github/metrics.svg
          output_action: git-commit
          committer_branch: main
          committer_message: "chore(stats): update metrics [skip ci]"
